<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>e621 ZIP Downloader</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #152f56;
            color: #ffffff;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin: 0 0 20px;
            color: #e4e6ea;
        }

        .card {
            background: #0b2039;
            border: 1px solid #2b4970;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        label {
            font-size: 0.85rem;
            color: #a0b0c0;
            font-weight: bold;
            margin-top: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #2b4970;
            border-radius: 5px;
            background: #091a2f;
            color: #ffffff;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #e4a73f;
        }

        input::placeholder {
            color: #71839a;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: 0;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            background: #444444 !important;
            color: #888888 !important;
            cursor: not-allowed;
        }

        #downloadBtn {
            background: #e4a73f;
            color: #152f56;
        }

        #downloadBtn:hover:not(:disabled) {
            background: #f0b95a;
        }

        #diagnosticBtn {
            background: #2b4970;
            color: #e4e6ea;
        }

        #diagnosticBtn:hover:not(:disabled) {
            background: #385b87;
        }

        #status {
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            white-space: pre-wrap;
            word-break: break-word;
        }

        #status.info {
            display: block;
            background: rgba(228, 167, 63, 0.15);
            border: 1px solid #e4a73f;
            color: #e4a73f;
        }

        #status.success {
            display: block;
            background: rgba(81, 207, 102, 0.12);
            border: 1px solid #51cf66;
            color: #51cf66;
        }

        #status.error {
            display: block;
            background: rgba(255, 107, 107, 0.12);
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
        }

        #preview {
            text-align: center;
            margin-bottom: 15px;
        }

        #preview img,
        #preview video {
            max-width: 100%;
            max-height: 500px;
            border-radius: 6px;
        }

        #diagnostics {
            background: #091a2f;
            border: 1px solid #2b4970;
            border-radius: 6px;
            padding: 12px;
        }

        #diagnostics h2 {
            color: #e4a73f;
            font-size: 1rem;
            margin: 0 0 10px;
        }

        #diagLog {
            background: #040d18;
            color: #00ff66;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            border-radius: 4px;
            max-height: 350px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .note {
            color: #9eafc1;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 12px;
        }

        .security-note {
            margin-top: 10px;
            color: #8498ad;
            font-size: 11px;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>e621 ZIP Downloader</h1>

    <div class="card">

        <div class="input-group">

            <label for="e621User">
                e621 Username
            </label>

            <input
                type="text"
                id="e621User"
                placeholder="Your e621 username"
                autocomplete="username"
            >

            <label for="e621Key">
                e621 API Key
            </label>

            <input
                type="password"
                id="e621Key"
                placeholder="Your e621 API key"
                autocomplete="current-password"
            >

            <label for="postUrl">
                e621 Post URL
            </label>

            <input
                type="text"
                id="postUrl"
                placeholder="https://e621.net/posts/6598745"
                autocomplete="off"
            >

        </div>

        <div class="button-group">

            <button id="downloadBtn">
                Download ZIP
            </button>

            <button id="diagnosticBtn">
                Run Diagnostics
            </button>

        </div>

        <div class="note">
            The downloader uses this site's Vercel API endpoint
            automatically. You do not need to enter a Worker URL.
        </div>

        <div class="security-note">
            Your API key is sent to the site's proxy over HTTPS when
            performing authenticated requests. Do not share your API key
            with anyone.
        </div>

    </div>

    <div id="status"></div>

    <div id="preview"></div>

    <div id="diagnostics">

        <h2>
            Diagnostic Console
        </h2>

        <div id="diagLog">
Ready.
        </div>

    </div>

<script>

"use strict";


/*
 * Vercel serverless function.
 */
const PROXY_URL = "/api/proxy";


/*
 * DOM elements.
 */
const userInput =
    document.getElementById("e621User");

const keyInput =
    document.getElementById("e621Key");

const postInput =
    document.getElementById("postUrl");

const downloadBtn =
    document.getElementById("downloadBtn");

const diagnosticBtn =
    document.getElementById("diagnosticBtn");

const statusBox =
    document.getElementById("status");

const preview =
    document.getElementById("preview");

const diagLog =
    document.getElementById("diagLog");


/*
 * Status display.
 */
function setStatus(message, type = "info") {

    statusBox.textContent = message;

    statusBox.className = type;
}


function clearStatus() {

    statusBox.textContent = "";

    statusBox.className = "";
}


/*
 * Diagnostic logging.
 */
function log(message) {

    const time =
        new Date().toLocaleTimeString();

    if (diagLog.textContent.trim() === "Ready.") {

        diagLog.textContent = "";
    }

    diagLog.textContent +=
        `[${time}] ${message}\n`;

    diagLog.scrollTop =
        diagLog.scrollHeight;
}


/*
 * Read credentials.
 */
function getCredentials() {

    const username =
        userInput.value.trim();

    const apiKey =
        keyInput.value.trim();


    if (!username) {

        throw new Error(
            "e621 username is required."
        );
    }


    if (!apiKey) {

        throw new Error(
            "e621 API key is required."
        );
    }


    return {
        username,
        apiKey
    };
}


/*
 * Extract an e621 post ID.
 */
function getPostId() {

    const value =
        postInput.value.trim();


    const match =
        value.match(
            /(?:https?:\/\/)?(?:www\.)?e621\.net\/posts\/(\d+)/i
        );


    if (!match) {

        throw new Error(
            "Invalid e621 URL. Use https://e621.net/posts/123456"
        );
    }


    return match[1];
}


/*
 * Make an authenticated request through Vercel.
 */
async function proxyRequest(
    targetUrl,
    username = "",
    apiKey = ""
) {

    const response =
        await fetch(PROXY_URL, {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({

                url: targetUrl,

                username: username,

                apiKey: apiKey
            })
        });


    const contentType =
        response.headers.get(
            "content-type"
        ) || "";


    if (!response.ok) {

        let message;


        if (
            contentType.includes(
                "application/json"
            )
        ) {

            const data =
                await response.json();

            message =
                data.error ||
                data.message ||
                JSON.stringify(data);

        } else {

            message =
                await response.text();
        }


        throw new Error(
            `Proxy returned HTTP ${response.status}: ${message}`
        );
    }


    return response;
}


/*
 * Fetch e621 post information.
 */
async function fetchPost(
    postId,
    username,
    apiKey
) {

    const targetUrl =
        `https://e621.net/posts/${postId}.json`;


    const response =
        await proxyRequest(
            targetUrl,
            username,
            apiKey
        );


    const data =
        await response.json();


    if (
        !data ||
        !data.post
    ) {

        throw new Error(
            "e621 returned an unexpected response."
        );
    }


    return data.post;
}


/*
 * Fetch media through Vercel.
 */
async function fetchMedia(fileUrl) {

    const response =
        await proxyRequest(
            fileUrl
        );


    return await response.blob();
}


/*
 * Display downloaded media.
 */
function showPreview(
    blob,
    extension
) {

    preview.innerHTML = "";


    const objectUrl =
        URL.createObjectURL(blob);


    const videoExtensions = [
        "webm",
        "mp4",
        "mov"
    ];


    if (
        videoExtensions.includes(
            extension.toLowerCase()
        )
    ) {

        const video =
            document.createElement("video");


        video.controls = true;

        video.loop = true;

        video.autoplay = true;

        video.muted = true;

        video.src =
            objectUrl;


        preview.appendChild(
            video
        );

    } else {

        const image =
            document.createElement("img");


        image.src =
            objectUrl;

        image.alt =
            "e621 post preview";


        preview.appendChild(
            image
        );
    }
}


/*
 * DIAGNOSTICS
 */
async function runDiagnostics() {

    diagnosticBtn.disabled = true;

    downloadBtn.disabled = true;


    diagLog.textContent =
        "Starting diagnostic tests...\n";


    try {

        log(
            "1. Testing browser → Vercel connection..."
        );


        const response =
            await fetch(
                PROXY_URL
            );


        log(
            `   HTTP status: ${response.status}`
        );


        const text =
            await response.text();


        log(
            `   Response: ${text}`
        );


        if (
            response.status === 400 &&
            text.includes(
                "Missing 'url' parameter"
            )
        ) {

            log(
                "   SUCCESS: Browser can reach Vercel!"
            );

        } else {

            throw new Error(
                "Unexpected response from /api/proxy."
            );
        }


        log(
            "2. Testing Vercel → e621 connection..."
        );


        const testUrl =
            "https://e621.net/posts/6598745.json";


        const encodedUrl =
            encodeURIComponent(
                testUrl
            );


        const e621ProxyUrl =
            `${PROXY_URL}?url=${encodedUrl}`;


        const e621Response =
            await fetch(
                e621ProxyUrl
            );


        log(
            `   e621 proxy HTTP status: ${e621Response.status}`
        );


        const e621Text =
            await e621Response.text();


        if (
            !e621Response.ok
        ) {

            log(
                `   e621 response: ${e621Text.slice(0, 500)}`
            );


            throw new Error(
                `e621 returned HTTP ${e621Response.status}`
            );
        }


        let data;


        try {

            data =
                JSON.parse(
                    e621Text
                );

        } catch {

            throw new Error(
                "Vercel returned a response from e621, but it was not valid JSON."
            );
        }


        if (
            !data ||
            !data.post
        ) {

            throw new Error(
                "e621 response did not contain post data."
            );
        }


        log(
            "   SUCCESS: Vercel can reach e621!"
        );


        log(
            `   Post ID: ${data.post.id}`
        );


        if (
            data.post.file &&
            data.post.file.url
        ) {

            log(
                `   File: ${data.post.file.url}`
            );

        } else {

            log(
                "   Warning: post did not contain a media URL."
            );
        }


        const username =
            userInput.value.trim();

        const apiKey =
            keyInput.value.trim();


        if (
            username &&
            apiKey
        ) {

            log(
                "3. Testing authenticated e621 request..."
            );


            const postId =
                postInput.value.trim()
                    ? getPostId()
                    : "6598745";


            const authenticatedPost =
                await fetchPost(
                    postId,
                    username,
                    apiKey
                );


            log(
                `   SUCCESS: Authentication accepted for post #${authenticatedPost.id}.`
            );


            if (
                authenticatedPost.file &&
                authenticatedPost.file.url
            ) {

                log(
                    "4. Testing media download through Vercel..."
                );


                const media =
                    await fetchMedia(
                        authenticatedPost.file.url
                    );


                log(
                    `   SUCCESS: Media downloaded (${(media.size / 1024).toFixed(1)} KB).`
                );
            }
        }


        setStatus(
            "Diagnostics completed successfully.",
            "success"
        );


    } catch (error) {

        console.error(
            "Diagnostic error:",
            error
        );


        log(
            `ERROR: ${error.message}`
        );


        setStatus(
            error.message,
            "error"
        );


    } finally {

        diagnosticBtn.disabled = false;

        downloadBtn.disabled = false;
    }
}


/*
 * DOWNLOAD ZIP
 */
async function downloadZip() {

    downloadBtn.disabled = true;

    diagnosticBtn.disabled = true;


    clearStatus();

    preview.innerHTML = "";


    try {

        const {
            username,
            apiKey
        } =
            getCredentials();


        const postId =
            getPostId();


        setStatus(
            `Fetching e621 post #${postId}...`,
            "info"
        );


        const post =
            await fetchPost(
                postId,
                username,
                apiKey
            );


        if (
            !post.file ||
            !post.file.url
        ) {

            throw new Error(
                "No downloadable file was found. The post may have been deleted."
            );
        }


        const fileUrl =
            post.file.url;


        const extension =
            post.file.ext ||
            "bin";


        setStatus(
            `Downloading media (${(post.file.size / 1024 / 1024).toFixed(2)} MB)...`,
            "info"
        );


        const mediaBlob =
            await fetchMedia(
                fileUrl
            );


        showPreview(
            mediaBlob,
            extension
        );


        setStatus(
            "Building ZIP file...",
            "info"
        );


        const zip =
            new JSZip();


        const folder =
            zip.folder(
                postId
            );


        /*
         * Main media file.
         */
        folder.file(
            `${postId}.${extension}`,
            mediaBlob
        );


        /*
         * Artist tags.
         */
        let artists =
            "unknown_artist";


        if (
            post.tags &&
            Array.isArray(
                post.tags.artist
            ) &&
            post.tags.artist.length
        ) {

            artists =
                post.tags.artist.join(
                    "\n"
                );
        }


        folder.file(
            "artist.txt",
            artists
        );


        /*
         * All tags.
         *
         * IMPORTANT:
         * Each tag is now placed on its own line.
         * There are NO commas between tags.
         */
        let allTags = "";


        if (post.tags) {

            for (
                const [
                    category,
                    tags
                ]
                of Object.entries(
                    post.tags
                )
            ) {

                if (
                    Array.isArray(tags) &&
                    tags.length
                ) {

                    allTags +=
                        `--- ${category.toUpperCase()} ---\n`;

                    allTags +=
                        `${tags.join("\n")}\n\n`;
                }
            }
        }


        folder.file(
            "tags.txt",
            allTags.trim()
        );


        /*
         * Metadata.
         */
        const metadata =
`Post ID: ${postId}
Rating: ${post.rating || "unknown"}
Score: ${post.score?.total ?? "unknown"}
Dimensions: ${post.file.width || "?"} x ${post.file.height || "?"}
File Extension: ${extension}
File Size: ${post.file.size || 0} bytes

Sources:
${
    Array.isArray(post.sources) &&
    post.sources.length
        ? post.sources.join("\n")
        : "None"
}

Description:
${post.description || "No description provided."}
`;


        folder.file(
            "metadata.txt",
            metadata
        );


        /*
         * Generate ZIP.
         */
        const zipBlob =
            await zip.generateAsync({

                type: "blob",

                compression: "DEFLATE",

                compressionOptions: {
                    level: 6
                }
            });


        /*
         * Download ZIP.
         */
        const zipUrl =
            URL.createObjectURL(
                zipBlob
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            zipUrl;


        link.download =
            `${postId}.zip`;


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            () => {
                URL.revokeObjectURL(
                    zipUrl
                );
            },
            1000
        );


        setStatus(
            `Success! ${postId}.zip was downloaded.`,
            "success"
        );


    } catch (error) {

        console.error(
            "Download error:",
            error
        );


        setStatus(
            error.message,
            "error"
        );


    } finally {

        downloadBtn.disabled = false;

        diagnosticBtn.disabled = false;
    }
}


/*
 * Button events.
 */
downloadBtn.addEventListener(
    "click",
    downloadZip
);


diagnosticBtn.addEventListener(
    "click",
    runDiagnostics
);

</script>

</body>
</html>
